<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ReDI School Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">ReDI</div>
      <div class="header-text">
        <h1>ReDI School Chatbot</h1>
        <p class="tagline">Answers from official ReDI pages, with links</p>
      </div>
    </header>

    <main class="conversation" id="conversation">
      <!-- New messages are announced to screen readers -->
      <section id="chat-log" class="log" role="log" aria-live="polite" aria-label="Conversation"></section>
      <p id="loading" class="visually-hidden" role="status" hidden>Looking for an answer…</p>
    </main>

    <form id="chat-form" class="composer" novalidate>
      <div class="composer-row">
        <label for="question" class="visually-hidden">Your question</label>
        <input id="question" name="question" type="text" autocomplete="off" maxlength="500"
               placeholder="Ask about ReDI School…" aria-describedby="form-error">
        <button id="send" class="send" type="submit">Send</button>
      </div>
      <p id="form-error" class="form-error" role="alert"></p>
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
